name: Back up published menu

on:
  workflow_dispatch:
  # TODO: Enable hourly scheduling after completing the checklist in BACKUPS.md.
  # schedule:
  #   - cron: '23 * * * *'

permissions:
  contents: write

concurrency:
  group: published-menu-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run verify:backup
      - run: npm run backup:menu
      - run: npm run verify:backup
      - name: Commit complete backup
        run: |
          git add data/published-menu-backup.json data/published-media
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Back up published menu and photos'
          git push origin HEAD:main
